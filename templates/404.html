{% extends "base.html" %}

{% block title %}页面不存在 | {{ site_name }}{% endblock %}
{% block body_class %}error-page{% endblock %}

{% block content %}
<section class="error-shell">
  <div class="error-code" aria-hidden="true">404</div>
  <p class="eyebrow">失迹 · Missing Archive</p>
  <h1>未找到相关页面</h1>
  <p>这条索引可能已经失效，或者它从一开始就没有被写进这份档案。</p>
  <a class="toolbar-button" href="{{ url_for('main.index') }}">返回首页</a>
  <p class="error-verse">鸿飞那复计东西<small>苏轼《和子由渑池怀旧》</small></p>
</section>
{% endblock %}
