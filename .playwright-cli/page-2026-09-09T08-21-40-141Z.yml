          - paragraph [ref=e128]: 雨很大，天气预报并不准确。人很少，我的预想倒是不错。 许是雨量不小，大小泉瀑遍布山间。大的如云台天瀑，高三百多米，颇为壮观。曾道听途说，这瀑布的水源在山西，山西看不得河南拿着他们那边的这一块儿地去挣钱，就断了这水，于是河南想了法子弄了几个水管续上了这瀑布。早些年是没人发现得了的——可没人爬那峭壁就为了验证这瀑布的真假！而近些年有了无人机，有的人爱拍那山水便飞了上去，于是发现那天瀑不过是几根还把足够高的水管。 雨水也是要投胎的。从天上来的水，是要被伞挡着的。从山上来的水，是供人瞻仰的。我站在瀑布下头，伞上噼里啪啦吵着，是山上的？天上的？还是水管里的？我不知道，伞也不知道，或许它们自己也不知道。落在伞上的那一刻，它们反倒成了一样的东西。 所谓烟雨，山雨似烟。山上缭绕的烟雨自然是多少传说里的仙气，只可惜我到底是个凡人，遇了仙气无福消受，哪怕小心翼翼也照样落得个鞋裤皆湿的下场。倒是路上见了一对父子，只穿着长裤球鞋便下去小溪踩水。父亲握着孩子的手，男孩儿在小溪里蹦哒。快活吗？自然是快活的。遭罪吗？那是之后的事情了。 沿路见了不少牌子，说这些石头刻着海的声音。走了不多时，见着三只蜗牛——两只趴在石头上不动弹，一只正歪歪扭扭蠕动着。我试着拽了它一下，它不动弹，只是换了个方向，就像它脚下那块石头一样。呵，蜗牛在水上，水在石头上。那么些年以前，这石头曾在水里的时候，许是也有些什么爬在上面？
          - link "阅读全文" [ref=e129] [cursor=pointer]:
