          - generic [ref=e93]:
            - paragraph [ref=e94]: 日月不失其体，故蔽而复明；江河不失其源，故穷而复通。盖天下有可晦之时，而无可夺之明；有可塞之势，而无可绝之流。惟其明在乎体，流在乎源，故浮云蔽之而不损，乱石横之而不亡。然则人世之变，亦有然者乎？曰：有之。城郭可墟，社稷可改，而一脉所系，未必遂与烟尘俱尽也。
            - paragraph [ref=e95]: 甲申之变，天倾地坼，九庙为墟，乘舆不返。于是衣冠震荡，士民流离，江淮以南，日色惨淡。其时论者或谓大势已去，孤城残旅，无补于天下；或谓新命既兴，旧人当顺时以全身。此言诚便于一身，而未必安于万姓也。夫天下之大，非一家之私藏；城池之守，非孤臣之私愤。兵燹之后，闾阎待命；锋镝之下，老稚无依。若执义者先解甲，守土者先委城，则一城百姓，将谁与庇？百年衣冠，将谁与存？此其所以知势不可支，而犹不得不支也。
            - paragraph [ref=e96]: 扬州之役，史公可法当之。北骑南下，书檄交至，劝以富贵，胁以兵威，公皆不顾。城中粮尽而人心危，矢石交飞而援师不至。然公犹登陴抚众，誓与城俱。夫扬州一城，岂足以抗天下之兵哉？而公之所守者，亦岂徒一堵之垣、一郡之地哉？城上有汉家冠带，城下有无告生民；城外一开，则屠戮随之，剃发易服之令随之，故公以残城当大兵，以一身任众命。及城陷而公不屈，身死而名益烈。是役也，胜负已判于兵势之先，而人心之明，乃见于城亡之后。
