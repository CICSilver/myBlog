          - paragraph [ref=e116]: 小雨，去了趟璐简王陵。陵外是一片月季花海，间在大门与十六石兽群之间。陵内直接连通潞王墓，西侧一牡丹花田接着次妃墓。她生前，他给不了她名分。她死后，他几乎花了半生积蓄，给她修了“共枕一山，共蹬一水”的、近乎皇陵的墓地。一条祖训，断了他再见母亲兄长的希望。又一条规制，让他只能言爱于空山。 下午，溜达去了影院，看了一部电影。情义二字几乎贯穿始终。但我不认可。非言其角色无情无义，而是这所谓“情义”为何？同样的感受，置于大众认可的范围内便成了情义，置于道德洼地也或成为别的什么。只是她称之为情义，她也称之为情义。或许，当一个关系从未被双方定义，那么便都可以归入情义范畴？ 我不愿过多分析数百年前的她和他，也不愿分析数十年前的她和他。他们受制于规训的、仅由历史文字记载的人物，是受制于大众道德的、经过艺术加工的角色。但她的观点很有意思。选择后的再选择，清醒的，独占的，排他的。一系列定义性描述指向了一个精确而清晰的词汇，爱情。爱情和情义，分的开吗？分的开的。那么爱情是否从一开始就是爱情呢？我觉得未必。 言至于此，她之于我如何？或许我应当试着用语言来表述——某些我没法精确地说出口的未名的东西。她之于我，是决策层面的偏向，是资源层面的倾斜，是情绪层面的耦合，是人格层面的欣赏。 若是以主流观点，这自然会被套上一个“喜欢”的帽子——当你的眼力、智力、心力几乎聚焦于一人时，这便是大众的看法。因为“喜欢”便要去“争取”，要去“追求”，倒是把人当了战利品！那么，我要如何去定义这感受？我的词汇是匮乏的，感受又是丰富的。其不可言表的部分，常常使我感到痛苦。
          - link "阅读全文" [ref=e117] [cursor=pointer]:
            - /url: /2026/5/wei_ming_zhi_ming
