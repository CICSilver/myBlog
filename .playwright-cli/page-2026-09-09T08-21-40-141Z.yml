          - generic [ref=e137]:
            - paragraph [ref=e138]: 每次回家，妈妈总会在晚饭后叫我出去散步。我向来是不喜欢散步的，多是有烦心事没法排解才会去水边转转。家住的小区距离河边不到一公里，大约五年前这河边还只是一条泥路。慢慢的因为城市整改，做了绿化、修了小亭，前两年也终于通了灯。人愈来愈多了，六七点的时候，多是些中老年人，吃完饭消消食，有两人做伴的、也有独自一人带个新闻广播的，当然也不乏牵着一两条狗的。
            - paragraph [ref=e139]: 河边的绿化近来做的很好，路边隔几步就有几丛粉色的蔷薇。蔷薇间种的位置很好，不在某个路灯下，而是间在两个灯中间，灯光从两侧顶部下来，层叠的花便站了起来。而草地上的月见草便活泼的多了，一片接着一片，间或在杂草中探头，四处都有她们的影子，散着时淡时浓的香气。她们并不避讳灯光，就那么大咧咧站在灯光下，恣意舒展着那四片朴素的粉瓣。于是我把她们拍下来，发给了她。妈妈在前面叫我，我耽搁地太久了。
            - paragraph [ref=e140]: 我们聊着时常聊起的话，叔叔给表弟托关系找的工作很苦很累、我在外面爬山看到的瀑布悬崖如何壮观。妈妈讲着，小婆婆癌症又复发，再次去医院做了化疗。二舅离了婚又结了婚，生了孩子又买了房子。“你知道吗？上次出去玩，她还给我打伞呢，就像你一样。”突然地我也开始讲着我想到的事情。妈妈安静了下来，听我絮叨着，她是怎样的能吃，又是怎样的能睡，是怎样的恐高，又是怎样的倔强。我讲的很开心，或许是那晚，笑得最久的一会儿。
