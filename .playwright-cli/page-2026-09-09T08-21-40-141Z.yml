          - paragraph [ref=e106]: 上周开车回家，从南门经过。南门里头有个幼儿园，正撞上六一，门口挤得满满堂堂都是家长，原本两辆车并排都宽敞的路被挤占地只堪堪能过一辆车。其实以前这里没这么些人的。 约莫二十年前，这南门还是个爬满野藤常年锁着的铁门，铁门外头住着个收废品的老头儿，再外头就是一片田了。南门里头是一个广场，正在幼儿园对面。那会儿还没有这么许多车子，广场也自然还没有变成停车场，我和一群孩子便经常骑着小自行车绕着那广场转悠。那会儿不怕太阳，也不怕下雨，真要说有什么怕的，也就是作业没写完回去挨骂了。不过也不是一直在骑车的，广场靠南边儿有一排连廊，顶上爬着野藤，便成了我们的一个休息点。车子随意地停在广场里头，孩子们扎堆趴在连廊靠着铁篱笆那一侧的草地上，似乎总有聊不完的天。我也不总是在广场玩的，那会儿有个自行车，就似乎整个小区哪里都能去得了。在别墅区里头有一小块儿水泥地，里头放了一个滑梯、一个跷跷板还有一个我叫不上名字的，圆圆的铁盒，里头一圈座位，外头带着跑一跑就能转很久的东西。从南边骑到北边，又从东边玩到西边，一直玩的太阳落山了，才慢悠悠晃回家——回去晚了，可就要在拐弯口撞上满脸不开心的妈妈咯。 后来啊，南门也不知道什么时候就开了，后头的田平掉了一部分，修了条路。那会儿我小学也毕业了，骑着电动车从那条路上初中。那条路当时才修好，两边儿还是田呢，种着不少油菜。春节之后开学的时候两边儿都是金色的，一排排的油菜花，远远地闻着是香的，但近了、浓了，倒又似乎让人觉着有些臭了。不过这些油菜花也就一两年，车子越来越多，新小区的住户也越来越多，油菜花的那些土地就得让道啦。初三那年的一个晚上，我正从晚自习回来，老远的看着那些被铲掉的田堆出来的一个小土山上，竟还站着两三只羊！一度我觉得是自己看错了，这地方就在新小区的后头，在马路边上，这羊吃完了草要去哪？不过我没停车，我正赶着回家呢。 现在这条路的人倒是多了，两边儿有卖衣服的、卖盆栽的、卖吃食的，说是城里倒更像是个集市，有够难走的。不过，走在这条路上，也就回家了。
          - link "阅读全文" [ref=e107] [cursor=pointer]:
            - /url: /2026/6/jia
