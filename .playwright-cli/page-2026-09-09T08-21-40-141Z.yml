          - generic [ref=e149]:
            - paragraph [ref=e150]: 最近一早总是不太睡得着。醒来时的缘由多种多样，但往常总能翻翻睡过去。清醒总是伴着一阵鼓点般的心跳节奏，就像睡着的不是我而是那个器官。但首先挣脱梦境的从里都不是它，它只是在战争打响后才后知后觉敲锣打鼓地叫醒整个身体。最先醒来的总是脑子，或者说，有人住进来了，它不得不在第一时间去尝试为我解开那道题。
            - paragraph [ref=e151]: 小时候总觉得，试卷上的题目就是我所能接触到的全部，后来又觉得工作里的题目才是我不得不重视的。我似乎一直在忽略我自己的题目。不，准确的说不是忽略，我只是从来没有过这般出题的机会。于是去年开始一头扎进了哲学的书里，试着用准确的语言来结构它。显然我失败了，但失败的不是语言而是感受、是经历。样本太少以至于理性没法继续推导、解释并归档。但今年有了不一样的感受，也有了不同去年的经历，尽管这还是不够，但我得出了一个中间结论。
            - paragraph [ref=e152]: 这个结论关于司各脱的haecceitias和quidditias，也即是“thisness”和“whatness”。
